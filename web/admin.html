<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت قبیله</title>
<style>body{font:14px Vazirmatn,Tahoma,sans-serif;background:#0d1424;color:#eee;margin:0;padding:12px;max-width:640px;margin-inline:auto}
input,textarea,button,select{font:inherit;padding:8px;background:#111828;color:#fff;border:2px solid #34446c;margin:3px 0}button{background:#33260f;border-color:#ffc04a;cursor:pointer}
h3{color:#ffc04a;margin:16px 0 6px}.r{display:flex;gap:6px;align-items:center;border-bottom:1px solid #1c2640;padding:4px 0}.r span{flex:1}small{opacity:.7}</style></head><body>
<h2>🛠️ پنل مدیریت قبیله</h2>
<div><input id="k" type="password" placeholder="ADMIN_KEY" style="width:60%"> <button onclick="go('state')">ورود / تازه‌سازی</button></div>
<div id="info"></div>
<h3>➕ افزودن شهروندها (هر خط یک اسم)</h3><textarea id="names" rows="3" style="width:100%"></textarea><button onclick="go('add',{names:v('names')})">اضافه کن</button>
<h3>⏳ در انتظار تأیید</h3><div id="pend"></div>
<h3>🗳️ رای‌گیری مدیرعامل شهر جدید</h3>
<div id="vs"></div>
<input id="vid" placeholder="آی‌دی ویدیوی رای‌گیری (اختیاری، برای کامنت #۱ #۲ …)" style="width:100%">
<input id="vt" placeholder="عنوان (اختیاری)" style="width:100%">
<div><button onclick="go('open_vote',{video:v('vid'),title:v('vt'),cands:sel()})">شروع رای‌گیری (نامزدها: انتخاب‌شده‌ها، وگرنه ۵ نفر برتر)</button> <button onclick="if(confirm('رای‌گیری بسته بشه و شهر جدید ساخته بشه؟'))go('close_vote')">پایان و اعلام برنده</button></div>
<h3>⚙️ تنظیمات</h3>
<div>ظرفیت هر شهر: <input id="cap" type="number" style="width:80px"> <button onclick="go('cap',{n:v('cap')})">ثبت</button></div>
<div>تعداد ساب‌ها (اگر API یوتیوب نداری): <input id="subs" type="number" style="width:100px"> <button onclick="go('subs',{n:v('subs')})">ثبت</button></div>
<div>مدیرعامل شهر اول: <input id="ceo" placeholder="اسم تو"> <input id="cn" placeholder="اسم شهر"> <button onclick="go('ceo1',{name:v('ceo'),city:v('cn')})">ثبت</button></div>
<div><button onclick="go('sync')">🔄 همگام‌سازی با یوتیوب</button></div>
<h3>👥 همه</h3><div id="all"></div>
<script>
const $=i=>document.getElementById(i),v=i=>$(i).value;let ST=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('k').value=sessionStorage.k||'';
async function go(op,x={}){sessionStorage.k=v('k');const r=await fetch('/api/tribe/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:v('k'),op:op==='state'?'noop':op,...x})});const j=await r.json();if(j.error)return alert(j.error);ST=j.state;draw()}
const sel=()=>[...document.querySelectorAll('.cand:checked')].map(e=>e.value);
function draw(){const s=ST;$('info').innerHTML=`شهروند: ${s.total} · ساب: ${s.subs} · ظرفیت: ${s.cap} · ساکن بی‌نام: ${s.anon} · یوتیوب: ${s.yt?'متصل':'غیرفعال'}`;
$('pend').innerHTML=s.all.filter(c=>c.status==='pending').map(c=>`<div class="r"><span>${esc(c.name)}</span><button onclick="go('approve',{id:'${c.id}'})">✅</button><button onclick="go('remove',{id:'${c.id}'})">🗑</button></div>`).join('')||'<small>خالی</small>';
$('all').innerHTML=s.all.filter(c=>c.status==='ok').map(c=>`<div class="r"><input type="checkbox" class="cand" value="${c.id}"><span>${esc(c.name)} <small>${c.src} · شهر ${c.city} · امتیاز ${c.xp}</small></span><button onclick="go('remove',{id:'${c.id}'})">🗑</button></div>`).join('');
$('vs').innerHTML=s.vote.open?'🟢 رای‌گیری باز: '+s.vote.cands.map(id=>{const c=s.all.find(x=>x.id===id);return esc(c?c.name:id)+' ('+(s.vote.tally[id]||0)+')'}).join(' | '):'<small>رای‌گیری بسته‌ست'+(s.ready?' — شهر پره، وقتشه!':'')+'</small>';$('cap').value=s.cap;$('subs').value=s.subs}
if($('k').value)go('state');
</script></body></html>
